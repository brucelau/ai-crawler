[project]
name = "ai-crawler"
version = "0.1.0"
description = "Intelligent e-commerce crawler with anti-detection, proxy rotation, and captcha solving"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "camoufox>=0.4.11",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "httpx>=0.27",
    "aiohttp>=3.10",
    "apscheduler>=3.10",
    "scrapy>=2.11",
    "itemadapter>=0.8",
    "pydantic>=2.0",
    "structlog>=24.0",
    "python-dotenv",
    "pillow>=10.0",
    "fake-useragent>=1.0",
    "tenacity>=8.0",
    "rich>=13.0",
    "dspy>=2.6",
    "curl_cffi>=0.15.0",
    "playwright-stealth>=1.0.6",
    "seleniumbase>=4.26",
    "pydantic>=2.0",
    "pydantic-ai>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
