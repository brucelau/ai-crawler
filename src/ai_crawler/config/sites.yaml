# Site Configuration for ai-crawler
# This file contains all site-specific configuration data.

# Tier configurations define the default settings for each tier level.
tier_configs:
  1:
    render: none
    proxy: thordata_dedicated
    delay_after: [2, 5]
    use_human_scroll: false
    change_ua: false
    use_cookies: false
  2:
    render: cloudscraper
    proxy: thordata_dedicated
    delay_after: [3, 6]
    use_human_scroll: false
    change_ua: false
    use_cookies: true
  3:
    render: lightpand
    proxy: thordata_dedicated
    delay_after: [2, 5]
    use_human_scroll: true
    change_ua: false
    use_cookies: false
  4:
    render: playwright
    proxy: thordata_dedicated
    delay_after: [3, 8]
    use_human_scroll: true
    change_ua: false
    use_cookies: false
  5:
    render: camoufox
    proxy: thordata_dedicated
    delay_after: [3, 8]
    use_human_scroll: true
    change_ua: true
    use_cookies: true
  6:
    render: cloudflare_uc
    proxy: thordata_dedicated
    delay_after: [5, 10]
    use_human_scroll: true
    change_ua: true
    use_cookies: true
  7:
    render: seleniumbase
    proxy: thordata_dedicated
    delay_after: [5, 10]
    use_human_scroll: true
    change_ua: true
    use_cookies: true
  8:
    render: cloakbrowser
    proxy: thordata_dedicated
    delay_after: [5, 10]
    use_human_scroll: true
    change_ua: true
    use_cookies: true

