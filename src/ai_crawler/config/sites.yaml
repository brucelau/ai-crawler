# URL patterns for page type detection (regex patterns per site).
patterns:
  amazon:
    search: ["^/s\\?", "^/s/\\?", "^/gp/search", "^/hw/shop"]
    detail: ["^/dp/[A-Z0-9]{10}", "^/gp/product/", "^/dp/"]
    seller: ["^/stores/", "^/sp/", "^/sell/"]
    review: ["^/product-reviews/", "^/gp/aw/review/", "^/hz/r/cr/"]
  walmart:
    search: ["^/search\\?", "^/search\\.php"]
    detail: ["^/ip/[A-Za-z0-9\\-]+/\\d+", "^/-/ip/"]
    seller: ["^/seller/", "^/store/"]
  target:
    search: ["^/s\\?", "^/search\\?"]
    detail: ["^/-/A-", "^/p/", "^/A-"]
    seller: ["^/store/", "^/sl/"]
  ebay:
    search: ["^/sch/i\\.html", "^/sch/"]
    detail: ["^/itm/\\d+", "^/itm/[A-Za-z0-9\\-]+\\d{9,}"]
    seller: ["^/str/", "^/usr/", "^/seller/"]
  homedepot:
    search: ["^/search\\?", "^/search\\.html", "^/catalog/search"]
    detail: ["^/p/", "^/ip/"]
  lowes:
    search: ["^/search\\?", "^/search\\.html"]
    detail: ["^/p/", "^/product/"]
  bestbuy:
    search: ["^/site/.*search\\?", "^/search\\?"]
    detail: ["^/site/.*\\.p\\?"]
  costco:
    search: ["^/.*\\.costco\\.com/.*search", "^/.*\\.costco\\.com/c/"]
    detail: ["^/.*\\.costco\\.com/.*product\\.html"]
